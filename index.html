<!DOCTYPE html>
 <html>
  <HEAD>
    <title>Todo App</title>
    <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700" rel="stylesheet">
    <link rel="stylesheet" href="style.css" media="screen" charset="utf-8">
  </HEAD>
  <body>
    <section class="header">
      <img src="./eisenhower-matrix.jpg" alt="eisenhower matrix">
      <a class="header__link" href="https://goal-life.com/page/method/matrix-eisenhower">Want more details?</a>
    </section>
    <main class="main">
      <article class="add-item" id="add-item">
        <label class="add-item__label" for="new-task">Add Item</label>
        <div class="add-item__wrapper">
          <input id="new-task"class="add-item__input" type="text">
          <button class="add-item__button">Add</button>
        </div>
      </article>
       <article class="todo">
      <h3 class="todo__title">Todo</h3>
      <ul class="todo__incomplete-task" id="incomplete-item">
        <li class="todo_item">
          <input class="todo__checkbox" type="checkbox">
          <label class="task">Pay Bills</label>
          <input type="text" class="task">
          <button class="edit">Edit</button>
          <button class="delete">
            <img src="./remove.svg" alt="remove taks">
          </button>
        </li>
        <li class="edit-mode">
          <input type="checkbox">
          <label class="todo__task">Go Shopping</label>
          <input type="text" value="go shopping" class="task">
          <button class="edit">Save</button>
          <button class="delete">
            <img src="./remove.svg" alt="remove taks">
          </button>
        </li>
      </ul>
      </article>
      <article class="completed">
      <h3 class="completed__title">Completed</h3>
      <ul class="completed__completed-task" id="completed-item">
        <li class="completed__item">
          <input type="checkbox" checked>
          <label class="todo__task">See the Doctor</label>
          <input type="text" class="completed__input-task">
          <button class="edit">Edit</button>
          <button class="delete">
            <img src="./remove.svg" alt="remove taks">
          </button>
        </li>
      </ul>
     </article>
    </main>
    <script src="app.js"></script>
  </body>
</html>
